services:
  postgres:
    image: postgres:16-alpine
    container_name: paulopop_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: paulopop
      POSTGRES_PASSWORD: paulopop123
      POSTGRES_DB: paulopop
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paulopop -d paulopop"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: node:20-alpine
    container_name: paulopop_app_dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npx prisma generate && npx prisma migrate deploy && npm run dev"
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://paulopop:paulopop123@paulopop_postgres_dev:5432/paulopop
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-dev-nextauth-secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_URL_INTERNAL: http://app:3000
      UPLOAD_DIR: /app/public/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-contato@paulopop.com.br}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Paulo Pop}
      NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}
      NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}
      OPENCAGE_API_KEY: ${OPENCAGE_API_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - uploads_dev_data:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
  uploads_dev_data:

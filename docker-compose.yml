services:
  postgres:
    image: postgres:16-alpine
    container_name: paulopop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paulopop
      POSTGRES_PASSWORD: paulopop123
      POSTGRES_DB: paulopop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paulopop -d paulopop"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: paulopop-app:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file:
      - .env.local
    container_name: paulopop_app
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

      # Banco de dados interno
      DATABASE_URL: postgresql://paulopop:paulopop123@postgres:5432/paulopop
      RUN_SEED: ${RUN_SEED:-false}

      # NextAuth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-dev-nextauth-secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_URL_INTERNAL: http://app:3000

      # IA
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

      # Upload local
      UPLOAD_DIR: /app/public/uploads

      # E-mail
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-contato@paulopop.com.br}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}

      # Site
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Paulo Pop}
      NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}

      # Mapas
      NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}
      OPENCAGE_API_KEY: ${OPENCAGE_API_KEY:-}
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:

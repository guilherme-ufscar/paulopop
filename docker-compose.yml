version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: paulopop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paulopop
      POSTGRES_PASSWORD: paulopop123
      POSTGRES_DB: paulopop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paulopop -d paulopop"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: paulopop_migrate
    environment:
      DATABASE_URL: postgresql://paulopop:paulopop123@postgres:5432/paulopop
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paulopop_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Banco de dados (interno Docker — não altere)
      DATABASE_URL: postgresql://paulopop:paulopop123@postgres:5432/paulopop

      # NextAuth (obrigatório)
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}

      # IA — Gemini (obrigatório para geração de textos e análise de mercado)
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # Upload local (não altere — volume mapeado abaixo)
      UPLOAD_DIR: /app/public/uploads

      # E-mail (opcional — necessário para notificações de leads)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-contato@paulopop.com.br}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}

      # Site
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Paulo Pop}
      NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}

      # Mapas (opcional)
      NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}
      OPENCAGE_API_KEY: ${OPENCAGE_API_KEY:-}
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  uploads_data:
